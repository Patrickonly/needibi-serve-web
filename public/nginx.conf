# Needibi Serve — nginx site config for the built app (the contents of dist/).
# Put the files of dist/ in /var/www/needibi (or change `root`), save this as
# /etc/nginx/conf.d/needibi.conf, then: nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name _;

    root /var/www/needibi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change, so cache them hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and index.html must always be re-checked.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any other path (e.g. /auth/choose-role) is a client route,
    # so serve index.html instead of a 404. This is what fixes refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
